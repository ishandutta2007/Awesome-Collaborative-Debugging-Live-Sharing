<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1035" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="text-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glowing Orbs Gradients -->
    <radialGradient id="cyan-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="purple-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="pink-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filter for glow -->
    <filter id="glow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 20px;
        fill: url(#text-accent);
        letter-spacing: 0.2px;
      }
      .desc-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 15px;
        fill: #94a3b8;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
      .code-font {
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace;
      }

      /* Dynamic Animations (Background & Accents Only - Foreground Stays Crisp & Steady) */
      @keyframes pulseOrb {
        0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.4; }
        50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.65; }
      }
      @keyframes floatBeam {
        0% { stroke-dashoffset: 1000; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes cursorBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes waveScan {
        0% { transform: translateY(0px); opacity: 0.3; }
        50% { transform: translateY(340px); opacity: 0.7; }
        100% { transform: translateY(0px); opacity: 0.3; }
      }
      @keyframes floatNode {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }

      .orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
      .orb-2 { animation: pulseOrb 10s ease-in-out infinite reverse; transform-origin: 1000px 300px; }
      .orb-3 { animation: pulseOrb 7s ease-in-out infinite; transform-origin: 600px 380px; }

      .beam-line {
        stroke-dasharray: 20 15;
        animation: floatBeam 25s linear infinite;
      }

      .cursor-blink { animation: cursorBlink 1s ease-in-out infinite; }
      .scan-line { animation: waveScan 6s ease-in-out infinite; }
      .floating-card-1 { animation: floatNode 5s ease-in-out infinite; }
      .floating-card-2 { animation: floatNode 5.5s ease-in-out infinite 1s; }
      .floating-card-3 { animation: floatNode 6s ease-in-out infinite 2s; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" fill="url(#bg-grad)" rx="16" />

  <!-- Background Decorative Glowing Orbs -->
  <circle class="orb-1" cx="180" cy="90" r="160" fill="url(#cyan-glow)" filter="url(#glow-blur)" />
  <circle class="orb-2" cx="1020" cy="300" r="190" fill="url(#purple-glow)" filter="url(#glow-blur)" />
  <circle class="orb-3" cx="620" cy="380" r="140" fill="url(#pink-glow)" filter="url(#glow-blur)" />

  <!-- Tech Subtle Grid Pattern -->
  <g opacity="0.12">
    <path d="M 0 70 L 1200 70 M 0 140 L 1200 140 M 0 210 L 1200 210 M 0 280 L 1200 280 M 0 350 L 1200 350" stroke="#38bdf8" stroke-width="1" />
    <path d="M 120 0 L 120 420 M 240 0 L 240 420 M 360 0 L 360 420 M 480 0 L 480 420 M 600 0 L 600 420 M 720 0 L 720 420 M 840 0 L 840 420 M 960 0 L 960 420 M 1080 0 L 1080 420" stroke="#38bdf8" stroke-width="1" />
  </g>

  <!-- Animated Connection Beams -->
  <g opacity="0.35">
    <path class="beam-line" d="M 100 340 C 350 340, 450 120, 750 120 S 1050 260, 1150 260" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="beam-line" d="M 50 180 C 250 80, 500 290, 800 210 S 1100 90, 1180 140" fill="none" stroke="#a855f7" stroke-width="1.5" />
  </g>

  <!-- Foreground Badge / Indicator -->
  <g transform="translate(60, 45)">
    <rect width="210" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="16" cy="16" r="5" fill="#10b981" />
    <circle cx="16" cy="16" r="9" fill="#10b981" opacity="0.25" class="cursor-blink" />
    <text x="32" y="21" class="code-font" font-size="12" fill="#38bdf8" font-weight="600">LIVE SYNC ACTIVE</text>
    <text x="150" y="21" class="code-font" font-size="11" fill="#64748b">v2026.3</text>
  </g>

  <!-- Main Hero Titles (Strictly in foreground, bold, crisp) -->
  <g transform="translate(60, 125)">
    <!-- Main Title -->
    <text class="title-text" x="0" y="0">
      Awesome Collaborative Debugging
    </text>
    <text class="title-text" x="0" y="52">
      &amp; Live Code Sharing <tspan fill="#38bdf8">⚡</tspan>
    </text>

    <!-- Subtitle -->
    <text class="subtitle-text" x="0" y="96">
      Real-Time Distributed Pair Programming • Shared Terminals • Cloud Dev Environments
    </text>

    <!-- Tagline -->
    <text class="desc-text" x="0" y="126">
      Curated ecosystem of elite SaaS suites and high-performance open-source tools for frictionless remote collaboration.
    </text>
  </g>

  <!-- Feature Interactive Showcase Cards (Lower half) -->
  <g transform="translate(60, 315)">
    <!-- Pill 1: Remote Pair Programming -->
    <g class="floating-card-1">
      <rect width="240" height="58" rx="12" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4" />
      <circle cx="28" cy="29" r="14" fill="#0284c7" fill-opacity="0.2" />
      <text x="22" y="34" font-size="15">👥</text>
      <text x="52" y="27" class="pill-text">Pair Programming</text>
      <text x="52" y="44" class="desc-text" font-size="11">Shared Cursors &amp; Context</text>
    </g>

    <!-- Pill 2: Shared Debugger -->
    <g class="floating-card-2" transform="translate(260, 0)">
      <rect width="250" height="58" rx="12" fill="url(#card-grad)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.4" />
      <circle cx="28" cy="29" r="14" fill="#4f46e5" fill-opacity="0.2" />
      <text x="21" y="34" font-size="15">🐞</text>
      <text x="52" y="27" class="pill-text">Synchronized Debugging</text>
      <text x="52" y="44" class="desc-text" font-size="11">Breakpoints &amp; Call Stacks</text>
    </g>

    <!-- Pill 3: Terminal Multiplexing -->
    <g class="floating-card-3" transform="translate(530, 0)">
      <rect width="260" height="58" rx="12" fill="url(#card-grad)" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.4" />
      <circle cx="28" cy="29" r="14" fill="#9333ea" fill-opacity="0.2" />
      <text x="21" y="34" font-size="15">💻</text>
      <text x="52" y="27" class="pill-text">Live Shared Terminals</text>
      <text x="52" y="44" class="desc-text" font-size="11">P2P, Web &amp; SSH Tunnels</text>
    </g>

    <!-- Pill 4: Open Source & Self Hosted -->
    <g class="floating-card-1" transform="translate(810, 0)">
      <rect width="270" height="58" rx="12" fill="url(#card-grad)" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.4" />
      <circle cx="28" cy="29" r="14" fill="#059669" fill-opacity="0.2" />
      <text x="21" y="34" font-size="15">🚀</text>
      <text x="52" y="27" class="pill-text">Zero Vendor Lock-in</text>
      <text x="52" y="44" class="desc-text" font-size="11">Open Source &amp; Self-Hosted</text>
    </g>
  </g>

  <!-- Border Frame Accent -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="#334155" stroke-width="1" />
</svg>
